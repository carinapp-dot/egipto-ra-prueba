<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Misión Egipto V5 — RA + Inmersión 3D</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:transparent}
.hud{position:fixed;z-index:20;left:8px;right:8px;top:8px;text-align:center;pointer-events:none}
.msg{display:inline-block;background:#fff8e8ee;color:#382510;padding:9px 13px;border-radius:14px;font-weight:700;box-shadow:0 2px 10px #0004}
.controls{position:fixed;z-index:31;right:10px;top:58px;display:flex;gap:7px;flex-direction:column}
.ctrl{border:1px solid #d3ad62;background:#fff8e8ee;color:#33230f;border-radius:50%;width:44px;height:44px;font-size:20px}
.panel{position:fixed;z-index:60;left:10px;right:10px;bottom:10px;max-height:61%;overflow:auto;background:#fffdf4f5;color:#2e2418;border:2px solid #d3ad62;border-radius:18px;padding:14px;box-shadow:0 5px 22px #0006;display:none}
.panel h2{font-size:20px;margin:0 42px 8px 0}.panel h3{font-size:16px;margin:12px 0 5px}.panel p{font-size:15px;line-height:1.42;margin:7px 0}
.close{position:absolute;right:10px;top:9px;border:0;background:#17324d;color:white;border-radius:10px;padding:8px 10px;font-weight:bold}
.action,.quiz button{display:block;width:100%;margin:7px 0;border:1px solid #b28b48;background:#fff7df;border-radius:11px;padding:11px;text-align:left;font-size:15px}
.quiz button.correct{background:#dff4df}.quiz button.wrong{background:#f8dddd}.feedback{font-weight:bold;margin-top:8px}.small{font-size:12px;color:#6b583e}

.arMenu{position:fixed;z-index:40;left:8px;right:8px;bottom:8px;display:none;grid-template-columns:repeat(3,1fr);gap:7px}
.arMenu button{min-height:48px;border:1px solid #d3ad62;border-radius:13px;background:#fff8e8f2;color:#30200d;font-weight:700;font-size:13px;box-shadow:0 2px 9px #0005;padding:7px}
.arMenu button:active{transform:scale(.97)}
.interiorMenu{position:fixed;z-index:42;left:8px;right:8px;bottom:8px;display:none;grid-template-columns:repeat(2,1fr);gap:7px}
.interiorMenu button{min-height:50px;border:1px solid #e3c77d;border-radius:13px;background:#231b14ee;color:#fff;font-weight:700;font-size:13px;padding:8px}
.museumFrame{width:100%;height:310px;border:0;border-radius:12px;background:#eee}
.credit{font-size:11px;color:#6b583e;line-height:1.3}

#audioExpanded.open{display:flex!important}
.controls.compact{opacity:.72}
.panel.audio-open{right:62px}

/* VERSIÓN VERTICAL PARA CELULAR */
@media (orientation: portrait), (max-width: 700px){
  .hud{left:6px;right:6px;top:6px}
  .msg{font-size:13px;padding:7px 10px;max-width:78%}
  .controls{right:7px;top:50px}
  .ctrl{width:38px;height:38px;font-size:17px}

  /* Panel ocupa la pantalla de forma vertical sin tapar controles esenciales */
  .panel{
    left:6px;right:6px;bottom:6px;
    top:64px; bottom:10px;
    max-height:none;
    padding:12px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:15px;
  }
  .panel h2{font-size:18px;margin-right:38px}
  .panel p{font-size:14px}
  .close{padding:7px 9px}

  /* Menú principal vertical: dos columnas grandes */
  .arMenu{
    left:6px;right:6px;bottom:6px;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }
  .arMenu button{
    min-height:46px;
    font-size:12px;
    padding:6px;
  }
  .arMenu button[data-htmlkey="museo"]{grid-column:1/3!important}

  /* Interior vertical y cómodo */
  .interiorMenu{
    left:6px;right:6px;bottom:6px;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
  }
  .interiorMenu button{min-height:46px;font-size:12px;padding:6px}

  /* Modelos arqueológicos: visor vertical, sin corte lateral */
  .museumFrame{
    width:100%;
    height:46vh;
    min-height:330px;
    max-height:500px;
    display:block;
    border-radius:12px;
  }

  .quiz button,.action{font-size:14px;padding:10px}
}

/* La cámara/escena siempre llena la pantalla sin deformarse */
a-scene,.a-canvas{
  width:100vw!important;
  height:100vh!important;
  max-width:100vw!important;
  overflow:hidden!important;
}
video{
  width:100vw!important;
  height:100vh!important;
  object-fit:cover!important;
}


/* INMERSIÓN 3D V5 */
#immersive3d{position:fixed;inset:0;z-index:100;display:none;background:#080706;color:#fff;overflow:hidden}
#immersiveCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#immTop{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#immTitle{background:#16120ddd;border:1px solid #b8965d;padding:9px 12px;border-radius:13px;font-weight:800;max-width:72%;box-shadow:0 3px 16px #0008}
#immExit{pointer-events:auto;border:1px solid #c5a46b;background:#201910e8;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}
#immInfo{position:absolute;left:10px;right:10px;bottom:82px;background:#17120eea;border:1px solid #b8965d;border-radius:15px;padding:12px;box-shadow:0 4px 20px #0009}
#immInfo p{margin:0;font-size:14px;line-height:1.4}
#immControls{position:absolute;left:10px;right:10px;bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
#immControls button{min-height:54px;border:1px solid #c6a76f;background:#211a13e8;color:#fff;border-radius:13px;font-weight:800;font-size:13px}
#immControls button:disabled{opacity:.35}
#immHint{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 10px;border-radius:12px;font-size:12px;white-space:nowrap;opacity:.9}

</style>
</head>
<body>
<div class="hud"><div id="status" class="msg">Permití la cámara y apuntá a la lámina de Egipto</div></div>
<div class="controls" id="audioControls">
<button id="audioToggle" class="ctrl" title="Audio">🎧</button>
<div id="audioExpanded" style="display:none;flex-direction:column;gap:7px">
<button id="soundBtn" class="ctrl" title="Sonido ambiental">🔇</button>
<button id="narrateBtn" class="ctrl" title="Narrar contenido">🔊</button>
</div>
</div>
<div id="panel" class="panel"><button id="close" class="close">✕</button><h2 id="ptitle"></h2><div id="pbody"></div></div>


<div id="arMenu" class="arMenu">
 <button data-htmlkey="piramide">🏜️ Pirámide / Entrar 3D</button>
 <button data-htmlkey="faraon">👑 Faraón</button>
 <button data-htmlkey="sarcófago">⚱️ Sarcófago</button>
 <button data-htmlkey="jeroglificos">𓂀 Jeroglíficos</button>
 <button data-htmlkey="dioses">🐺 Dioses</button>
 <button data-htmlkey="desafio">🏆 Desafío</button>
 <button data-htmlkey="museo" style="grid-column:1/4">🏛️ Museo arqueológico 3D</button>
</div>
<div id="interiorMenu" class="interiorMenu">
 <button data-part="entrada">🚪 Entrada</button>
 <button data-part="galeria">↗️ Gran Galería</button>
 <button data-part="rey">👑 Cámara del Rey</button>
 <button data-part="reina">🔎 Cámara llamada de la Reina</button>
 <button id="tourBtn">🎧 Visita narrada</button>
 <button id="exitInterior">↩️ Volver</button>
</div>


<div id="immersive3d">
  <canvas id="immersiveCanvas"></canvas>
  <div id="immTop"><div id="immTitle">🏺 Interior de la Gran Pirámide</div><button id="immExit">↩ RA</button></div>
  <div id="immHint">Arrastrá para mirar alrededor</div>
  <div id="immInfo"><p id="immText">Preparando el recorrido…</p></div>
  <div id="immControls">
    <button id="immPrev">◀ Anterior</button>
    <button id="immNarrate">🔊 Escuchar</button>
    <button id="immNext">Avanzar ▶</button>
  </div>
</div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart:true; uiScanning:yes;"
 color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true"
 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-assets></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false" cursor="fuse:false; rayOrigin:mouse"
 raycaster="far:10000; objects:.clickable; interval:50"></a-camera>
<a-entity light="type:ambient; intensity:1.25"></a-entity>
<a-entity light="type:directional; intensity:1.3" position="-1 2 1"></a-entity>

<a-entity mindar-image-target="targetIndex:0" id="target">

<!-- Pirámide 3D con textura geométrica y entrada -->
<a-entity id="pyramidGroup" position="0 0.03 0.08">
 <a-cone class="clickable" data-key="piramide" radius-bottom="0.27" radius-top="0" height="0.34"
  segments-radial="4" rotation="0 45 0" color="#b9a178" roughness="1" metalness="0"></a-cone>
 <a-box position="0 -0.10 0.20" width="0.065" height="0.075" depth="0.025" color="#332718"></a-box>
 <a-text value="ENTRAR A LA PIRAMIDE" position="0 -0.235 0.03" align="center" width="1.0" color="#17324d"></a-text>
</a-entity>

<a-box position="0 -0.145 0.08" width="0.57" height="0.025" depth="0.57" color="#9e8968" roughness="1"></a-box>
<a-box position="0 -0.128 0.08" width="0.51" height="0.018" depth="0.51" color="#ad9874" roughness="1"></a-box>
<!-- Objetos 3D estilizados -->
<a-entity class="clickable" data-key="faraon" position="-0.37 0.27 0.07">
 <a-sphere radius="0.065" color="#d8aa3d"></a-sphere>
 <a-cone radius-bottom="0.08" radius-top="0.045" height="0.13" position="0 -0.10 0" color="#174c70"></a-cone>
</a-entity>
<a-text value="FARAON" position="-0.37 0.13 0.08" align="center" width="0.55" color="#fff"></a-text>

<a-entity class="clickable" data-key="sarcófago" position="0.37 0.27 0.07">
 <a-capsule radius="0.05" height="0.15" color="#c89b36"></a-capsule>
 <a-ring radius-inner="0.052" radius-outer="0.059" color="#1d5d7b"></a-ring>
</a-entity>
<a-text value="SARCOFAGO" position="0.37 0.13 0.08" align="center" width="0.55" color="#fff"></a-text>

<a-entity class="clickable" data-key="jeroglificos" position="-0.37 -0.25 0.07">
 <a-box width="0.14" height="0.16" depth="0.018" color="#d8bd83"></a-box>
 <a-text value="𓂀" position="0 0 0.012" align="center" width="0.36" color="#392b1d"></a-text>
</a-entity>
<a-text value="JEROGLIFICOS" position="-0.37 -0.37 0.08" align="center" width="0.52" color="#fff"></a-text>

<a-entity class="clickable" data-key="dioses" position="0.37 -0.25 0.07">
 <a-cone radius-bottom="0.075" radius-top="0.035" height="0.14" color="#20252a"></a-cone>
 <a-sphere radius="0.045" position="0 0.09 0" color="#1e2225"></a-sphere>
 <a-cone radius-bottom="0.022" radius-top="0" height="0.08" position="-0.025 0.15 0" color="#1e2225"></a-cone>
 <a-cone radius-bottom="0.022" radius-top="0" height="0.08" position="0.025 0.15 0" color="#1e2225"></a-cone>
</a-entity>
<a-text value="DIOSES" position="0.37 -0.37 0.08" align="center" width="0.52" color="#fff"></a-text>

<a-box class="clickable" data-key="desafio" position="0 -0.41 0.08" width="0.46" height="0.12" depth="0.025" color="#67539a"></a-box>
<a-text value="DESAFIO DEL ARQUEOLOGO" position="0 -0.425 0.10" align="center" width="0.70" color="#fff"></a-text>

<!-- Interior interactivo, oculto al inicio -->
<a-entity id="interior" visible="false" position="0 0 0.14">
 <a-plane width="0.65" height="0.55" color="#2a2118" opacity="0.93"></a-plane>
 <a-triangle vertex-a="0 0.24 0.02" vertex-b="-0.28 -0.20 0.02" vertex-c="0.28 -0.20 0.02"
  color="#b7894c" opacity="0.42"></a-triangle>
 <a-box position="0 -0.16 0.035" width="0.06" height="0.035" depth="0.02" color="#e8c56f"></a-box>
 <a-text value="ENTRADA" class="clickable" data-key="entrada" position="0 -0.22 0.05" align="center" width="0.45" color="#fff"></a-text>
 <a-box position="-0.05 0.01 0.035" width="0.03" height="0.25" depth="0.018" rotation="0 0 -22" color="#e8c56f"></a-box>
 <a-text value="GRAN GALERIA" class="clickable" data-key="galeria" position="-0.18 0.02 0.05" align="center" width="0.38" color="#fff"></a-text>
 <a-box position="0.08 0.09 0.035" width="0.11" height="0.055" depth="0.02" color="#e8c56f"></a-box>
 <a-text value="CAMARA DEL REY" class="clickable" data-key="rey" position="0.18 0.13 0.05" align="center" width="0.40" color="#fff"></a-text>
 <a-box position="0.02 -0.055 0.035" width="0.10" height="0.05" depth="0.02" color="#d7b766"></a-box>
 <a-text value="CAMARA LLAMADA DE LA REINA" class="clickable" data-key="reina" position="0.17 -0.07 0.05" align="center" width="0.42" color="#fff"></a-text>
 <a-box class="clickable" data-key="cerrarInterior" position="0.26 0.22 0.05" width="0.09" height="0.07" depth="0.02" color="#7c342d"></a-box>
 <a-text value="X" position="0.26 0.205 0.07" align="center" width="0.30" color="#fff"></a-text>
</a-entity>

</a-entity>
</a-scene>

<script>
const panel=document.querySelector('#panel'),title=document.querySelector('#ptitle'),body=document.querySelector('#pbody'),
status=document.querySelector('#status'), interior=document.querySelector('#interior'), pyramid=document.querySelector('#pyramidGroup');
let lastNarration='', audioCtx=null, ambientNodes=[], ambientOn=false, targetVisible=false;

const sections={
faraon:{title:'👑 El faraón',text:'El faraón era el gobernante de Egipto. Tenía funciones políticas y religiosas y ocupaba la cima de la organización del Estado.',html:`<p>El <b>faraón</b> era el gobernante de Egipto. Tenía funciones políticas y religiosas y ocupaba la cima de la organización del Estado.</p><p><b>Observá el objeto 3D:</b> sus colores recuerdan algunos de los símbolos asociados con la realeza egipcia.</p>`},
'sarcófago':{title:'⚱️ Sarcófago y mundo funerario',text:'Los sarcófagos protegían el cuerpo del difunto y podían llevar inscripciones y decoraciones. Estas prácticas se relacionaban con las creencias egipcias sobre la vida después de la muerte.',html:`<p>Los <b>sarcófagos</b> protegían el cuerpo del difunto y podían llevar inscripciones y decoraciones.</p><p>La momificación y los rituales funerarios estaban relacionados con las creencias sobre la vida después de la muerte.</p>`},
jeroglificos:{title:'𓂀 Jeroglíficos',text:'La escritura jeroglífica utilizaba signos. Algunos representaban sonidos y otros podían representar palabras o ideas.',html:`<p>La escritura <b>jeroglífica</b> utilizaba signos. Algunos representaban sonidos y otros podían representar palabras o ideas.</p><p><b>Misión:</b> buscá tres signos diferentes en la lámina y comparalos.</p>`},
dioses:{title:'🐺 Dioses egipcios',text:'La religión egipcia era politeísta. Anubis estaba vinculado con los ritos funerarios, Ra con el Sol y Osiris con el mundo de los muertos y la renovación.',html:`<p>La religión egipcia era <b>politeísta</b>: se rendía culto a numerosos dioses y diosas.</p><p><b>Anubis</b>: ritos funerarios. <b>Ra</b>: asociado con el Sol. <b>Osiris</b>: relacionado con el mundo de los muertos y la renovación.</p>`},
entrada:{title:'🚪 Entrada',text:'La entrada daba acceso a los pasajes interiores de la Gran Pirámide.',html:'<p>La <b>entrada</b> daba acceso a los pasajes interiores de la Gran Pirámide.</p>'},
galeria:{title:'↗️ Gran Galería',text:'La Gran Galería es un corredor alto e inclinado que forma parte del sistema de pasajes internos.',html:'<p>La <b>Gran Galería</b> es un corredor alto e inclinado que forma parte del sistema de pasajes internos.</p>'},
rey:{title:'👑 Cámara del Rey',text:'La Cámara del Rey se encuentra en el interior de la Gran Pirámide y contiene un sarcófago de granito.',html:'<p>La llamada <b>Cámara del Rey</b> se encuentra en el interior de la Gran Pirámide y contiene un sarcófago de granito.</p>'},
reina:{title:'🔎 Cámara llamada de la Reina',text:'Esta cámara recibe tradicionalmente el nombre de Cámara de la Reina, aunque el nombre no significa que allí fuera enterrada una reina.',html:'<p>Esta cámara recibe tradicionalmente el nombre de <b>Cámara de la Reina</b>, aunque ese nombre no significa que allí fuera enterrada una reina.</p>'}
};
function hideMenus(){arMenu.style.display='none';interiorMenu.style.display='none';}
function restoreMenu(){if(!targetVisible)return; if(interior.getAttribute('visible')) interiorMenu.style.display='grid'; else arMenu.style.display='grid';}
function openPanel(){hideMenus();collapseAudio();panel.style.display='block';panel.scrollTop=0;}
function closePanel(){panel.style.display='none';speechSynthesis?.cancel();collapseAudio();restoreMenu();}
function showSection(k){const s=sections[k];title.textContent=s.title;body.innerHTML=s.html+`<button class="action" id="speakHere">🔊 Escuchar narración</button>`;openPanel();lastNarration=s.text;document.querySelector('#speakHere').addEventListener('click',()=>speak(lastNarration));}
function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.92;speechSynthesis.speak(u);}
document.querySelector('#narrateBtn').addEventListener('click',()=>{if(lastNarration)speak(lastNarration);else speak('Bienvenidos a Misión Egipto. Apuntá a la lámina y tocá los símbolos para explorar.');autoCollapseAudio();});
document.querySelector('#close').addEventListener('click',closePanel);

const arMenu=document.querySelector('#arMenu'), interiorMenu=document.querySelector('#interiorMenu');
function toggleInterior(on){
 panel.style.display='none'; collapseAudio();
 interior.setAttribute('visible',on); pyramid.setAttribute('visible',!on);
 arMenu.style.display=on?'none':'grid'; interiorMenu.style.display=on?'grid':'none';
 if(on){status.textContent='Vista interior: elegí una parte';lastNarration='Bienvenidos al interior de la Gran Pirámide. Elegí una parte para comenzar la visita.';speak(lastNarration);}
 else{status.textContent='¡Egipto encontrado! Elegí una opción';speechSynthesis?.cancel();}
}


function openMuseum(){collapseAudio();
 title.textContent='🏛️ Museo arqueológico 3D';
 body.innerHTML=`<p>Explorá modelos tridimensionales de piezas arqueológicas reales. Podés girarlos y acercarlos con el dedo.</p>
 <h3>Estatua de Minnefer — Reino Antiguo</h3>
 <iframe class="museumFrame" title="Estatua de Minnefer" allow="autoplay; fullscreen; xr-spatial-tracking"
 src="https://sketchfab.com/models/5697bb6a10c04f9c9eda558a3d125527/embed?autostart=0&ui_theme=dark"></iframe>
 <p class="credit">Modelo 3D: Cleveland Museum of Art, Open Access / CC0.</p>
 <h3>Vaso canopo con cabeza de halcón — Dinastía 26</h3>
 <iframe class="museumFrame" title="Vaso canopo" allow="autoplay; fullscreen; xr-spatial-tracking"
 src="https://sketchfab.com/models/3c723241b22d4a208472cad3a83ac831/embed?autostart=0&ui_theme=dark"></iframe>
 <p class="credit">Modelo 3D: Cleveland Museum of Art, Open Access / CC0.</p>`;
 openPanel();
 lastNarration='Estás en el museo arqueológico 3D. Estos modelos representan piezas reales conservadas en colecciones de museo.';
}

/* ===== RECORRIDO 3D WEBGL: prototipo V5 ===== */
const imm=document.querySelector('#immersive3d'), immCanvas=document.querySelector('#immersiveCanvas'),
immText=document.querySelector('#immText'), immTitle=document.querySelector('#immTitle'),
immPrev=document.querySelector('#immPrev'), immNext=document.querySelector('#immNext'),
immNarrate=document.querySelector('#immNarrate'), immExit=document.querySelector('#immExit');

const tourStops=[
 {name:'🚪 Pasaje de entrada', text:'Ingresamos por un corredor estrecho de piedra. Los pasajes de la Gran Pirámide fueron construidos dentro de una enorme masa de bloques. El espacio reducido ayuda a imaginar la dificultad de desplazarse por su interior.', pos:[0,1.25,8.5], look:[0,1.1,0]},
 {name:'↗️ Gran Galería', text:'La Gran Galería cambia por completo la escala del recorrido. Es un corredor ascendente, alto y estrecho, con muros que se aproximan hacia arriba mediante hiladas salientes. Su función exacta dentro del proyecto constructivo sigue siendo estudiada.', pos:[0,1.45,1.2], look:[0,2.3,-7]},
 {name:'🔎 Cámara llamada de la Reina', text:'Esta sala recibe tradicionalmente el nombre de Cámara de la Reina, pero ese nombre no demuestra que una reina fuera enterrada aquí. La cámara posee un techo a dos aguas y forma parte del complejo sistema interno de la pirámide.', pos:[6.0,1.35,-5.0], look:[6,1.2,-10]},
 {name:'👑 Cámara del Rey', text:'Llegamos a la llamada Cámara del Rey. Está construida con grandes bloques de granito y conserva un sarcófago también de granito. Sobre esta cámara existen espacios de descarga que ayudan a distribuir el enorme peso de la construcción.', pos:[0,1.35,-13.2], look:[0,1.2,-18]}
];
let renderer3,scene3,camera3,step3=0,dragging=false,lastX=0,lastY=0,yaw=0,pitch=0,animId=null;

function stoneMat(hex, rough=.92){return new THREE.MeshStandardMaterial({color:hex,roughness:rough,metalness:0});}
function addBox(scene, size, pos, color, rot=[0,0,0]){
 const g=new THREE.BoxGeometry(...size), m=stoneMat(color), o=new THREE.Mesh(g,m);
 o.position.set(...pos);o.rotation.set(...rot);scene.add(o);return o;
}
function buildImmersive(){
 if(renderer3)return;
 renderer3=new THREE.WebGLRenderer({canvas:immCanvas,antialias:true});
 renderer3.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer3.setSize(innerWidth,innerHeight,false);
 renderer3.outputColorSpace=THREE.SRGBColorSpace;
 scene3=new THREE.Scene(); scene3.background=new THREE.Color(0x090806);
 scene3.fog=new THREE.Fog(0x090806,8,34);
 camera3=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.05,80);

 scene3.add(new THREE.HemisphereLight(0xc8ad7c,0x15110d,1.15));
 const lamp=new THREE.PointLight(0xffd08a,18,18,2);lamp.position.set(0,3,2);scene3.add(lamp);

 // Entrada y corredor
 addBox(scene3,[5,.35,18],[0,-.15,4],0x7e6d55);
 addBox(scene3,[.35,3.2,18],[-2.35,1.45,4],0x8d7b5f);
 addBox(scene3,[.35,3.2,18],[2.35,1.45,4],0x8d7b5f);
 addBox(scene3,[5,.35,18],[0,3.05,4],0x75644e);

 // Gran Galería: piso ascendente y muros altos
 addBox(scene3,[5,.35,15],[0,.35,-5.0],0x87745a,[-.14,0,0]);
 addBox(scene3,[.45,6.3,15],[-2.35,3.0,-5],0x806d54,[-.14,0,0]);
 addBox(scene3,[.45,6.3,15],[2.35,3.0,-5],0x806d54,[-.14,0,0]);
 // Corbelled ledges
 for(let i=0;i<4;i++){
   addBox(scene3,[.35,.35,14.5],[-2.05+i*.22,4.1+i*.38,-5],0x9a8565,[-.14,0,0]);

 }

 // Queen chamber branch
 addBox(scene3,[4.6,.3,8],[6,-.1,-7.2],0x8a7659);
 addBox(scene3,[.3,3.0,8],[3.85,1.35,-7.2],0x7f6c52);
 addBox(scene3,[.3,3.0,8],[8.15,1.35,-7.2],0x7f6c52);
 addBox(scene3,[4.6,.3,8],[6,2.85,-7.2],0x75634c);
 addBox(scene3,[5,.3,5],[6,-.1,-11.4],0x917b5b);
 addBox(scene3,[.3,3.4,5],[3.65,1.5,-11.4],0x806b50);
 addBox(scene3,[.3,3.4,5],[8.35,1.5,-11.4],0x806b50);
 // pitched roof effect
 addBox(scene3,[3.2,.28,5],[4.85,3.2,-11.4],0x8d7657,[0,0,-.48]);
 addBox(scene3,[3.2,.28,5],[7.15,3.2,-11.4],0x8d7657,[0,0,.48]);

 // King's chamber, reddish granite
 addBox(scene3,[6,.35,8],[0,-.15,-17],0x704a3b);
 addBox(scene3,[.35,4.2,8],[-2.85,1.75,-17],0x775043);
 addBox(scene3,[.35,4.2,8],[2.85,1.75,-17],0x775043);
 addBox(scene3,[6,.35,8],[0,3.85,-17],0x68443a);
 addBox(scene3,[2.0,.9,1.0],[0,.3,-19.3],0x5e3d34);

 // Stone seams to avoid a smooth "box" look.
 const seamMat=new THREE.LineBasicMaterial({color:0x3c3026,transparent:true,opacity:.55});
 for(let z=12;z>-21;z-=1.4){
   const pts=[new THREE.Vector3(-2.2,.02,z),new THREE.Vector3(2.2,.02,z)];
   scene3.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),seamMat));
 }
 window.addEventListener('resize',resizeImm);
 immCanvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
 window.addEventListener('pointerup',()=>dragging=false);
 window.addEventListener('pointermove',e=>{
   if(!dragging||imm.style.display==='none')return;
   yaw-=(e.clientX-lastX)*.004; pitch-=(e.clientY-lastY)*.003;
   pitch=Math.max(-.75,Math.min(.75,pitch)); lastX=e.clientX;lastY=e.clientY;
 });
 animateImm();
}
function resizeImm(){if(!renderer3)return;camera3.aspect=innerWidth/innerHeight;camera3.updateProjectionMatrix();renderer3.setSize(innerWidth,innerHeight,false);}
function animateImm(){
 animId=requestAnimationFrame(animateImm);
 if(!renderer3||imm.style.display==='none')return;
 camera3.rotation.order='YXZ';camera3.rotation.y=yaw;camera3.rotation.x=pitch;
 renderer3.render(scene3,camera3);
}
function moveToStop(i,instant=false){
 step3=Math.max(0,Math.min(tourStops.length-1,i));const s=tourStops[step3];
 immTitle.textContent=s.name;immText.textContent=s.text;immPrev.disabled=step3===0;
 immNext.textContent=step3===tourStops.length-1?'Finalizar ▶':'Avanzar ▶';
 const start=camera3.position.clone(), end=new THREE.Vector3(...s.pos);
 const target=new THREE.Vector3(...s.look),dir=target.clone().sub(end);
 const endYaw=Math.atan2(-dir.x,-dir.z), endPitch=Math.atan2(dir.y,Math.sqrt(dir.x*dir.x+dir.z*dir.z));
 if(instant){camera3.position.copy(end);yaw=endYaw;pitch=endPitch;return;}
 let t0=performance.now(); const dur=1500;
 function go(now){let t=Math.min(1,(now-t0)/dur);t=t*t*(3-2*t);camera3.position.lerpVectors(start,end,t);
   if(t<1)requestAnimationFrame(go);else{yaw=endYaw;pitch=endPitch;}
 } requestAnimationFrame(go);
}
function enterImmersive(){
 speechSynthesis?.cancel(); panel.style.display='none'; hideMenus(); collapseAudio();
 buildImmersive();imm.style.display='block';step3=0;moveToStop(0,true);
 status.style.display='none';
}
function exitImmersive(){
 speechSynthesis?.cancel();imm.style.display='none';status.style.display='';
 status.textContent=targetVisible?'¡Egipto encontrado! Elegí una opción':'Volvé a apuntar a la lámina de Egipto';
 restoreMenu();
}
immPrev.addEventListener('click',()=>moveToStop(step3-1));
immNext.addEventListener('click',()=>{if(step3>=tourStops.length-1){exitImmersive();}else moveToStop(step3+1);});
immNarrate.addEventListener('click',()=>speak(tourStops[step3].text));
immExit.addEventListener('click',exitImmersive);

document.querySelectorAll('[data-htmlkey]').forEach(b=>b.addEventListener('click',()=>{
 const k=b.dataset.htmlkey;
 if(k==='piramide')enterImmersive(); else if(k==='desafio')startQuiz(); else if(k==='museo')openMuseum(); else showSection(k);
}));
document.querySelectorAll('[data-part]').forEach(b=>b.addEventListener('click',()=>{
 const k=b.dataset.part; showSection(k); setTimeout(()=>speak(sections[k].text),120);
}));
document.querySelector('#exitInterior').addEventListener('click',()=>toggleInterior(false));

const tourOrder=['entrada','galeria','reina','rey']; let tourStop=false;
document.querySelector('#tourBtn').addEventListener('click',async()=>{
 tourStop=false;
 for(const k of tourOrder){
   if(tourStop)break;
   showSection(k);
   await new Promise(resolve=>{
     speechSynthesis.cancel();
     const u=new SpeechSynthesisUtterance(sections[k].text);u.lang='es-AR';u.rate=.88;u.onend=()=>setTimeout(resolve,500);u.onerror=resolve;
     speechSynthesis.speak(u);
   });
 }
});

function bindClicks(){
 document.querySelectorAll('.clickable').forEach(el=>el.addEventListener('click',()=>{
  const k=el.dataset.key;
  if(k==='piramide')enterImmersive();
  else if(k==='cerrarInterior')toggleInterior(false);
  else if(k==='desafio')startQuiz();
  else if(sections[k])showSection(k);
 }));
}
bindClicks();

/* Ambiente generado en el navegador: viento suave + pulsos graves, sin archivos externos. */

const audioToggle=document.querySelector('#audioToggle');
const audioExpanded=document.querySelector('#audioExpanded');
let audioHideTimer=null;
function collapseAudio(){
 audioExpanded.classList.remove('open');
 audioToggle.textContent='🎧';
}
function expandAudio(){
 audioExpanded.classList.add('open');
 audioToggle.textContent='✕';
 clearTimeout(audioHideTimer);
 audioHideTimer=setTimeout(collapseAudio,5000);
}
audioToggle.addEventListener('click',()=>{
 if(audioExpanded.classList.contains('open')) collapseAudio(); else expandAudio();
});
function autoCollapseAudio(){
 clearTimeout(audioHideTimer);
 audioHideTimer=setTimeout(collapseAudio,900);
}

document.querySelector('#soundBtn').addEventListener('click',async()=>{
 const btn=document.querySelector('#soundBtn');
 if(ambientOn){ambientNodes.forEach(n=>{try{n.stop?.();n.disconnect?.()}catch(e){}});ambientNodes=[];ambientOn=false;btn.textContent='🔇';autoCollapseAudio();return;}
 audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();
 const gain=audioCtx.createGain();gain.gain.value=.025;gain.connect(audioCtx.destination);
 const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
 const d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.35;
 const noise=audioCtx.createBufferSource();noise.buffer=buffer;noise.loop=true;
 const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;
 noise.connect(filter);filter.connect(gain);noise.start();
 const osc=audioCtx.createOscillator(),og=audioCtx.createGain();osc.type='sine';osc.frequency.value=73;og.gain.value=.012;osc.connect(og);og.connect(audioCtx.destination);osc.start();
 ambientNodes=[noise,osc,gain,filter,og];ambientOn=true;btn.textContent='🔉';autoCollapseAudio();
});

const questions=[
{q:'1. ¿Cuál era una función principal de las grandes pirámides?',a:['Ser mercados','Servir como monumentos funerarios reales','Ser puertos'],c:1},
{q:'2. ¿Quién estaba en la cima de la organización política egipcia?',a:['El campesino','El artesano','El faraón'],c:2},
{q:'3. ¿Para qué servía un sarcófago?',a:['Para proteger el cuerpo del difunto','Para navegar por el Nilo','Para guardar alimentos'],c:0},
{q:'4. ¿Qué eran los jeroglíficos?',a:['Una herramienta agrícola','Un sistema de escritura','Una moneda'],c:1},
{q:'5. ¿Con qué estaba relacionado Anubis?',a:['La agricultura','La navegación','Los ritos funerarios'],c:2},
{q:'6. ¿Qué río fue fundamental para la civilización egipcia?',a:['Éufrates','Nilo','Tigris'],c:1},
{q:'7. ¿Cómo se llama el corredor alto e inclinado de la Gran Pirámide?',a:['Gran Galería','Patio Real','Avenida Sagrada'],c:0},
{q:'8. ¿Qué característica tenía la religión egipcia?',a:['No tenía dioses','Era monoteísta en toda su historia','Rendía culto a numerosos dioses'],c:2},
{q:'9. ¿Con qué astro se asociaba principalmente Ra?',a:['La Luna','El Sol','Venus'],c:1},
{q:'10. ¿Qué proceso se relacionaba con la conservación del cuerpo?',a:['Momificación','Irrigación','Escritura'],c:0}
];
let quiz=[],qi=0,score=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){hideMenus();collapseAudio();quiz=shuffle(questions).slice(0,5);qi=0;score=0;renderQuestion();}
function renderQuestion(){
 title.textContent='🏆 Desafío del arqueólogo';
 if(qi>=quiz.length){body.innerHTML=`<p><b>¡Misión terminada!</b></p><p>Obtuviste <b>${score} de ${quiz.length}</b>.</p><button class="action" id="again">🔄 Jugar otra vez</button>`;openPanel();lastNarration=`Misión terminada. Obtuviste ${score} de ${quiz.length} respuestas correctas.`;document.querySelector('#again').addEventListener('click',startQuiz);return;}
 const x=quiz[qi];
 // También se mezcla el orden visible de respuestas conservando cuál es la correcta.
 const opts=x.a.map((v,i)=>({v,ok:i===x.c})); const mixed=shuffle(opts);
 body.innerHTML=`<p><b>Pregunta ${qi+1} de ${quiz.length}</b></p><p>${x.q.replace(/^\d+\.\s*/,'')}</p><div class="quiz">${mixed.map((o,i)=>`<button data-i="${i}" data-ok="${o.ok}">${o.v}</button>`).join('')}</div><div id="feedback" class="feedback"></div>`;
 openPanel();lastNarration=x.q;
 body.querySelectorAll('[data-i]').forEach(btn=>btn.addEventListener('click',()=>{
  const ok=btn.dataset.ok==='true',fb=document.querySelector('#feedback');body.querySelectorAll('[data-i]').forEach(b=>b.disabled=true);
  if(ok){score++;btn.classList.add('correct');fb.textContent='✓ ¡Correcto!';}
  else{btn.classList.add('wrong');body.querySelector('[data-ok="true"]').classList.add('correct');fb.textContent='Revisá la respuesta marcada en verde.';}
  setTimeout(()=>{qi++;renderQuestion()},1200);
 }));
}
const target=document.querySelector('#target');
target.addEventListener('targetFound',()=>{targetVisible=true;status.textContent='¡Egipto encontrado! Elegí una opción'; if(panel.style.display==='block') return; restoreMenu();});
target.addEventListener('targetLost',()=>{targetVisible=false;status.textContent='Volvé a apuntar a la lámina de Egipto'; hideMenus();});
</script>
